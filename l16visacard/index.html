<!DOCTYPE html>
<html>
    <head>

        <title>Visa Card</title>
        <link rel="stylesheet" href="./style.css" type="text/css">

    </head>
    <body>

        <div class="container">
            <div class="visacard">
                <form action="" method="">
                    <div class="logo">
                        <img src="./images-removebg-preview.png" alt="visacard" class="visalogo">
                    </div>

                    <div class="card-number">
                        <label for="card-digit">Card Number</label>
                        <input type="text" name="card-digit" id="card-digit" class="form-control" placeholder="xxxx xxxx xxxx xxxx" maxlength="20" required>
                        <span class="underline"></span>
                    </div>

                    <br><br>

                    <div class="form-group">

                        <div class="card-holder">
                            <label for="card-name">Card Holder Name</label>
                            <input type="text" name="card-name" id="card-name" class="form-control" placeholder="Your Full Name" required>
                            <span class="underline"></span>
                        </div>

                        <div class="card-date">
                            <label for="card-exp">Exp.Date</label>
                            <input type="text" name="card-exp" id="card-exp" class="form-control" placeholder="xx/xx" maxlength="5" required>
                            <span class="underline"></span>
                        </div>

                        <div class="card-code">
                            <label for="card-ccv">CCV</label>
                            <input type="text" name="card-ccv" id="card-ccv" class="form-control" placeholder="xxx" maxlength="3" required>
                            <span class="underline"></span>
                        </div>

                    </div>
                </form>
            </div>
        </div>
        


        <script src="./app.js" type="text/javascript"></script>
    </body>
</html>
