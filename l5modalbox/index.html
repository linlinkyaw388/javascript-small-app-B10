<!DOCTYPE html>
<html>
    <head>

        <title>Modal box</title>
        <link rel="stylesheet" href="./style.css" media="all">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />



    </head>
    <body>

        

        <div class="container">

           <img src="../img/images.jpg" alt="christmas">
           
           <h2>Modal Singup Form</h2>

           <button type="button" id="signup-btn">Sign Up</button>
           <button type="button" id="fullscreen-btn">Open Full Screen</button>
           <button type="button" id="closefullscreen-btn">Close Full Screen</button>

        </div>

        <div id="singupmodal" class="modal">
            <span class="btn-close" title="Close Modal">&times;</span>
        

        <form action="" method="">
            <h2>Register Form</h2>

            <div class="input-group">
                <i class="fas fa-user icon"></i>
                <input type="text" name="username" id="username" class="input-group-text" placeholder="Enter Your User Name">
            </div>

            <div class="input-group">
                <i class="fas fa-envelope icon"></i>
                <input type="email" name="email" id="email" class="input-group-text" placeholder="Enter Your Email">
            </div>

            <div class="input-group">
                <i class="fas fa-key icon"></i>
                <input type="password" name="password" id="password" class="input-group-text" placeholder="Enter Your password">
            </div>

            <button type="submit" class="btn">Register</button>
        </form>

        </div>
     


         <script src="./app.js" type="text/javascript"></script>

    </body>























</html>
