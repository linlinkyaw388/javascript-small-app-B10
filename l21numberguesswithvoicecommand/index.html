<!DOCTYPE html>
 <html lang="en">
     <head>

         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width,intial-scale=1.0">
         
                     
         <title>Number Guess with voice command</title>
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
         <link rel="stylesheet" href="./style.css">

    </head>
    <body>

       
         <div class="container">
            <h3>Number Guess With Voice Command</h3>
            <p>Guess a number between <span class="minnumber">00</span> to <span class="maxnumber">00</span></p>

            <form action="" method="" id="gameform" class="gameform" >
                <div class="form-group">
                    <input type="number" name="guessnumber" id="guessnumber" class="form-control" placeholder="Enter your guess number..." autocomplete="off" autofocus>
                    <input type="submit" id="btn" class="btn">
                </div>

                <span class="message1"></span>
                <span class="message2"></span>
            </form>

            <button type="button" id="mic-btn" class="mic-btn"><i class="fas fa-microphone"></i> Use Microphone</button>

            <div id="voice-container">
               <span></span>
            </div>

            
         </div>



   <script src="./app.js" type="text/javascript"></script>


    </body>
</html>
