<!DOCTYPE html>
<html>
    <head>

        <title>Modal box</title>
        <link rel="stylesheet" href="./style.css" media="all">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />



    </head>
    <body>

        <div class="container">
            <h2>Login Form</h2>
            <button type="button" id="modal-btn" class="modal-btn">Login</button>
        </div>

        <div id="login-modal" class="modal fade">
            <div class="modal-dialog">
              <div class=" modal-content">
                <div class="modal-header">
                    <span class="btn-close" title="Close Modal">&times;</span>
                    <img src="../img/images (1).jpg" class="avatar" alt="avatar">
                </div>

                <div class="modal-body">
                    <form action="" method="">
                        <div class="form-group">
                          <label class="username">Username</label>
                          <input type="text" name="username" id="username" class="form-control" placeholder="Enter Username" required>
                        </div>
                        <div class="form-group">
                          <label class="password">Password</label>
                          <input type="password" name="password" id="password" class="form-control" placeholder="Enter Password" required>
                        </div>
                        <!-- d-grid အပြည့်ပေါ်စေချင် boostrap ပုံစံ -->
                        <div class="d-grid">
                            <button type="submit" class="btn">Login</button>
                        </div>
                         <!-- for="" အစား input သုံး -->
                        <label>
                            <input type="checkbox" name="checked" id="checked">Remember Me
                        </label>
                    </form>
                </div>

                <div class="modal-footer">
                    <span class="forget">Forget <a href="javascript:void(0);">Password ?</a></span>
                </div>
              </div>
            </div>
        </div>
        


         <script src="./app.js" type="text/javascript"></script>

    </body>























</html>
