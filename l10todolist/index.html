<!DOCTYPE html>
<html>
    <head>

        <title>Todo List</title>
        <link rel="stylesheet" href="./style.css" media="all">

    <body>

        <div class="container">
            
            <h3>My Todo List</h3>

                    <input type="text" name="textbox" id="textbox" class="form-control" placeholder="Write Something..." autocomplete="off" autofocus>
                </div>
            </form>

            <ul id="list-group" class="list-group">
                <!-- <li class="completed">A Sann</li>

            </ul>
           

            
        </div>
       

         <script src="./app.js" type="text/javascript"></script>
