<!DOCTYPE html>
<html>
    <head>

        <title>Email Box</title>
        <link rel="stylesheet" href="./style.css" media="all">

    <body>

        <div class="container">
          
            <h3>This is Email Box.You can divided by a comma(",")</h3>

            <form action="" method="" class="form">
                <input type="email" name="emails[]" id="emails" class="form-control" placeholder="Enter Your Email address...">
                <textarea name="msg" id="msg" class="form-control" placeholder="Enter Massage"></textarea>
                <div class="justify-content-end">
                    <button type="submit" class="btn">Send</button>
                </div>
            </form>

            <div class="emailcontainer">
                <!-- <span class="email">Sample One</span>
                <span class="email">Sample Two</span>
                <span class="email">Sample Three</span>
                <span class="email">Sample Four</span>
                <span class="email">Sample Five</span> -->

        </div>
       

         <script src="./app.js" type="text/javascript"></script>
